name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build (default)
        run: go build ./...
      - name: Build (postgres sink)
        run: go build -tags postgres ./...
      - name: Vet
        run: go vet ./...
