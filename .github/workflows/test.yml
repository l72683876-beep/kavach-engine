name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build (default)
        run: go build ./...
      - name: Build (postgres sink)
        run: go build -tags postgres ./...
      - name: Vet
        run: go vet ./...
      - name: Go tests (race detector)
        run: go test -race ./...

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Simulator dependencies
        run: pip install aiohttp
      - name: One command, everything tested (build + race + burst + all suites)
        run: bash scripts/test.sh
